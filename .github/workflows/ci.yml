name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # vitest 4 needs Node 20 or newer. Node 18 still builds and loads the
      # package below, which is what the runtime support promises.
      - run: npm test
        if: matrix.node != 18
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Smoke test the packed tarball
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/syscli-oneclickdz-*.tgz
          node -e "const m = require('@syscli/oneclickdz'); if (typeof m.OneClickDZ !== 'function') process.exit(1)"
          node --input-type=module -e "import { OneClickDZ } from '@syscli/oneclickdz'; if (typeof OneClickDZ !== 'function') process.exit(1)"
          node -e "require('@syscli/oneclickdz/package.json')"
